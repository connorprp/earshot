name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac-capture:
    # real Apple hardware: validates the macOS capture port (wheels, echo gate,
    # speaker clustering, and actual Whisper ASR on Apple-TTS speech)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r capture/requirements-mac.txt
      - name: Download speaker model
        run: |
          mkdir -p capture/models
          curl -sL -o capture/models/nemo_en_titanet_small.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/nemo_en_titanet_small.onnx
      - run: cd capture && python ci_test_mac.py
      # owner election + voiceprint persistence (who on the mic is "me")
      - run: python capture/test_speakers.py
      # deliverable links + the guardrails on opening them (posix branch)
      - run: python capture/test_links.py
      # the BlackHole pin: hash guardrails + "the url still serves those bytes"
      - run: python capture/test_blackhole.py

  hub-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm ci
      - run: cd server && node ci_test.mjs

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t earshot-hub .

  # ---- the one-line installers (curl|bash / irm|iex) ----
  # These are how anyone who isn't Connor gets an agent: a piped script is never
  # quarantined, so it never meets Gatekeeper (which since macOS Tahoe blocks an
  # unsigned downloaded app outright) or SmartScreen. Each job serves the REAL
  # script from a real hub and installs against it, minus pairing and starting
  # (EARSHOT_INSTALL_DRY), then checks the agent could actually run.
  install-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm ci
      - name: Start a hub
        run: |
          cd server
          EARSHOT_MONGO="mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=300&connectTimeoutMS=300" \
            node index.js > /tmp/hub.log 2>&1 &
          for i in $(seq 1 40); do grep -q "listening on" /tmp/hub.log && break; sleep 1; done
          grep -q "listening on" /tmp/hub.log || { cat /tmp/hub.log; exit 1; }
      - name: Install via the piped one-liner
        env:
          EARSHOT_HUB: http://127.0.0.1:7071
          EARSHOT_INSTALL_DRY: "1"
        run: |
          export EARSHOT_APPDIR="$RUNNER_TEMP/earshot"
          curl -fsSL "$EARSHOT_HUB/install/mac" | bash
      - name: Check what it installed
        run: |
          ROOT="$RUNNER_TEMP/earshot"
          test -f "$ROOT/src/main.py" || { echo "no source tree"; exit 1; }
          test -x "$HOME/.local/bin/earshot" || { echo "no earshot command"; exit 1; }
          # the control script is generated by a heredoc: prove it still parses
          bash -n "$HOME/.local/bin/earshot"
          test -f "$HOME/Library/LaunchAgents/dev.earshot.capture.plist" || { echo "no LaunchAgent"; exit 1; }
          plutil -lint "$HOME/Library/LaunchAgents/dev.earshot.capture.plist"
          # the version it recorded must be the code the hub is serving
          test "$(cat "$ROOT/version.txt")" = "$(curl -fsSL http://127.0.0.1:7071/installer/capture.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          # the venv can actually run the agent, and a second update is a no-op
          "$ROOT/venv/bin/python" -c "import sys; sys.path.insert(0, '$ROOT/src'); import main, tray, updater; print('agent imports OK')"
          EARSHOT_APPDIR="$ROOT" "$ROOT/venv/bin/python" -c "import sys; sys.path.insert(0, '$ROOT/src'); import updater; print('re-update:', updater.apply('http://127.0.0.1:7071') or 'already current')"

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm ci
      # One step, deliberately: a Windows runner kills the step's process tree,
      # so a hub started in an earlier step is gone by the next one (POSIX
      # backgrounding survives, which is why install-mac can split them).
      # shell: powershell = Windows PowerShell 5.1, what a friend actually pastes
      # into — and whose native-stderr handling has broken this script before.
      - name: Install via the piped one-liner, against a real hub
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:EARSHOT_MONGO = "mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=300&connectTimeoutMS=300"
          $hubOut = "$env:RUNNER_TEMP\hub.log"
          Start-Process -WindowStyle Hidden node -ArgumentList "index.js" -WorkingDirectory server `
            -RedirectStandardOutput $hubOut -RedirectStandardError "$env:RUNNER_TEMP\hub.err"
          foreach ($i in 1..40) {
            if ((Get-Content $hubOut -ErrorAction SilentlyContinue) -match "listening on") { break }
            Start-Sleep 1
          }
          if (-not ((Get-Content $hubOut -ErrorAction SilentlyContinue) -match "listening on")) {
            Get-Content "$env:RUNNER_TEMP\hub.err" -ErrorAction SilentlyContinue
            throw "hub never started"
          }

          $env:EARSHOT_HUB = "http://127.0.0.1:7071"
          $root = "$env:RUNNER_TEMP\earshot"
          $env:EARSHOT_APPDIR = $root
          $env:EARSHOT_INSTALL_DRY = "1"
          irm "$env:EARSHOT_HUB/install/windows" | iex

          # ---- what it should have installed ----
          if (-not (Test-Path "$root\src\main.py")) { throw "no source tree" }
          if (-not (Test-Path "$root\start-agent.vbs")) { throw "no autostart script" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Startup')) 'Earshot.lnk'))) { throw "no startup shortcut" }
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\earshot.cmd")) { throw "no earshot command" }
          $want = (Invoke-RestMethod "$env:EARSHOT_HUB/installer/capture.json").version
          if ((Get-Content "$root\version.txt") -ne $want) { throw "version.txt is not what the hub serves" }
          # the venv can actually run the agent, and a second update is a no-op
          & "$root\venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$root\src'); import main, tray, updater; print('agent imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "the installed agent cannot import" }
          & "$root\venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$root\src'); import updater; print('re-update:', updater.apply('$env:EARSHOT_HUB') or 'already current')"
          if ($LASTEXITCODE -ne 0) { throw "updater failed on a second pass" }

  # ---- packaged desktop apps (tray + pairing; no terminal for end users) ----
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r capture/requirements-win-cpu.txt pystray pillow pyinstaller
      # deliverable links + the guardrails on opening them (windows branch:
      # os.startfile, and the executable extensions that matter most here)
      - run: python capture/test_links.py
      # owner election + voiceprint persistence (windows app-data store path)
      - run: python capture/test_speakers.py
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name EarshotCapture
          --paths capture
          --hidden-import main --hidden-import speakers --hidden-import echo_gate
          --hidden-import cuda_paths --hidden-import pyaudiowpatch --hidden-import pystray._win32
          --collect-all ctranslate2 --collect-all sherpa_onnx --collect-all tokenizers
          --collect-all faster_whisper
          capture/tray.py
      - name: Smoke test
        shell: pwsh
        run: |
          $env:EARSHOT_SMOKE = "1"
          $p = Start-Process -FilePath "dist\EarshotCapture.exe" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: EarshotCapture-windows
          path: dist/EarshotCapture.exe

  app-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r capture/requirements-mac.txt pystray pillow pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name "Earshot Capture"
          --paths capture
          --hidden-import main --hidden-import speakers --hidden-import echo_gate
          --hidden-import mac_audio --hidden-import mac_blackhole
          --hidden-import pystray._darwin
          --collect-all ctranslate2 --collect-all sherpa_onnx --collect-all tokenizers
          --collect-all faster_whisper
          capture/tray.py
      - name: Smoke test
        run: EARSHOT_SMOKE=1 "dist/Earshot Capture.app/Contents/MacOS/Earshot Capture"
      - name: Zip app
        run: ditto -c -k --keepParent "dist/Earshot Capture.app" EarshotCapture-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EarshotCapture-mac
          path: EarshotCapture-mac.zip
