# Earshot hub — ONE multi-tenant instance. Users sign in with Google; every
# tenant's board, sessions, files, and capture feed are isolated by their
# email. Secrets live in deploy/.env (see .env.example); never commit it.
services:
  earshot:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    ports: ["7071:7071"]
    environment:
      EARSHOT_MONGO: ${EARSHOT_MONGO}
      EARSHOT_DB: earshot-cloud
      EARSHOT_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # self-serve sign-in: whole domains and/or specific emails
      EARSHOT_ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      EARSHOT_ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      # OPTIONAL legacy/pre-seeded values — capture keys and Claude tokens are
      # normally self-serve (auto-provisioned key + token paste, in Settings)
      EARSHOT_CAPTURE_KEYS: ${CAPTURE_KEYS}
      EARSHOT_CLAUDE_TOKENS: ${CLAUDE_TOKENS}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_TOKEN_FALLBACK}
      EARSHOT_SECRET: ${SECRET}
    volumes: ["./out:/app/out"]
